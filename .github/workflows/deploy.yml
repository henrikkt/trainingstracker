name: Prüfen und auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Standard: nur Lesezugriff. Schreibrechte für Pages bekommt nur der Deploy-Job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pruefen:
    name: Prüfen und bauen
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Sicherheitsprüfung der Abhängigkeiten (bricht bei kritischen Funden ab)
        run: npm audit --audit-level=critical

      - name: Typecheck
        run: npm run typecheck

      - name: Unit-Tests
        run: npm test

      # Die E2E-Tests dieses Jobs prüfen die App im lokalen Modus (ohne Backend). Login, Einladung,
      # Verwaltung usw. testet der Job „Datenbank und Zugriffsregeln“ gegen einen lokalen Supabase-Stack.
      - name: Build ohne Backend (lokaler Modus) für die E2E-Tests
        run: npm run build:pages

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: End-to-End-Tests (lokaler Modus)
        run: npm run test:e2e
        env:
          CI: 'true'
          PW_CHANNEL: ''

      - name: Build für GitHub Pages (mit Supabase-Anbindung)
        run: npm run build:pages
        env:
          # Öffentliche Werte (Repository-Variablen, keine Secrets)
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Schutz davor, versehentlich eine App ohne Server-Anbindung zu veröffentlichen
      - name: Prüfen, dass Supabase-Anbindung und CSP im Build stecken
        if: vars.VITE_SUPABASE_URL != ''
        run: |
          grep -rqF "${{ vars.VITE_SUPABASE_URL }}" dist/assets || { echo "::error::Supabase-URL fehlt im JavaScript-Build"; exit 1; }
          grep -qF "${{ vars.VITE_SUPABASE_URL }} wss://" dist/index.html || { echo "::error::Supabase-URL fehlt in der CSP"; exit 1; }

      - name: Artefakt für Pages hochladen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  supabase:
    name: Datenbank und Zugriffsregeln (echtes Supabase)
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # Nur die Dienste, die die Tests brauchen (Postgres, Auth, REST, Gateway, Edge Functions)
      - name: Supabase lokal starten (Migrationen werden eingespielt, Functions bereitgestellt)
        run: npx supabase start -x studio,imgproxy,storage-api,realtime,logflare,vector,postgres-meta,supavisor,mailpit

      - name: Zugangsdaten des Test-Stacks setzen
        run: node scripts/supabase-env.mjs

      - name: RLS- und API-Tests
        run: npm test -- supabase/tests
        env:
          STEMM_INTEGRATION: '1'

      # App mit VITE_SUPABASE_URL des lokalen Stacks bauen (aus scripts/supabase-env.mjs) → Login-Pflicht aktiv
      - name: App gegen den lokalen Stack bauen
        run: npm run build:pages

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: E2E – Login, Einladung, Reset, Kontowechsel, Zugänge verwalten, Konto löschen
        run: npx playwright test auth admin
        env:
          CI: 'true'
          PW_CHANNEL: ''

      - name: Supabase stoppen
        if: always()
        run: npx supabase stop --no-backup

  # Rollt Migrationen und Edge Functions ins echte Supabase-Projekt aus – erst, wenn alle Tests grün sind.
  # Läuft nur, wenn das Projekt verknüpft ist (Repository-Variable SUPABASE_PROJECT_REF, Secrets
  # SUPABASE_ACCESS_TOKEN und SUPABASE_DB_PASSWORD). Bis dahin wird der Job übersprungen.
  supabase-deploy:
    name: Supabase ausrollen (Migrationen und Functions)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SUPABASE_PROJECT_REF != ''
    needs: [pruefen, supabase]
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-deploy
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJEKT: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Code holen
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Projekt verknüpfen
        run: npx supabase link --project-ref "$PROJEKT"

      - name: Migrationen einspielen
        run: npx supabase db push --remote --yes

      - name: Edge Functions ausrollen
        run: npx supabase functions deploy --use-api --yes

  deploy:
    name: Veröffentlichen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [pruefen, supabase]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
