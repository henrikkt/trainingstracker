name: Prüfen und auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Standard: nur Lesezugriff. Schreibrechte für Pages bekommt nur der Deploy-Job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pruefen:
    name: Prüfen und bauen
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Sicherheitsprüfung der Abhängigkeiten (bricht bei kritischen Funden ab)
        run: npm audit --audit-level=critical

      - name: Typecheck
        run: npm run typecheck

      - name: Unit-Tests
        run: npm test

      - name: Build (GitHub Pages)
        run: npm run build:pages
        env:
          # Öffentliche Werte (ab E6 als Repository-Variablen gesetzt, nicht als Secrets nötig)
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: End-to-End-Tests
        run: npm run test:e2e
        env:
          CI: 'true'
          PW_CHANNEL: ''

      - name: Artefakt für Pages hochladen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  supabase:
    name: Datenbank und Zugriffsregeln (echtes Supabase)
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # Nur die Dienste, die die Tests brauchen (Postgres, Auth, REST, Gateway)
      - name: Supabase lokal starten (Migrationen werden eingespielt)
        run: npx supabase start -x studio,imgproxy,storage-api,realtime,logflare,vector,edge-runtime,postgres-meta,supavisor,mailpit

      - name: Zugangsdaten des Test-Stacks setzen
        run: node scripts/supabase-env.mjs

      - name: RLS- und API-Tests
        run: npm test -- supabase/tests
        env:
          STEMM_INTEGRATION: '1'

      # App mit VITE_SUPABASE_URL des lokalen Stacks bauen (aus scripts/supabase-env.mjs) → Login-Pflicht aktiv
      - name: App gegen den lokalen Stack bauen
        run: npm run build:pages

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: E2E – Login, Einladung, Passwort-Reset, Kontowechsel
        run: npx playwright test auth
        env:
          CI: 'true'
          PW_CHANNEL: ''

      - name: Supabase stoppen
        if: always()
        run: npx supabase stop --no-backup

  deploy:
    name: Veröffentlichen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [pruefen, supabase]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
