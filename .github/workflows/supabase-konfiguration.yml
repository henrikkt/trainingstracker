name: Supabase-Konfiguration übertragen

# Überträgt die Einstellungen aus supabase/config.toml (v. a. Auth: Registrierung aus, Passwortlänge,
# Gültigkeit der Einladungs-/Reset-Links) ins echte Projekt. Nur manuell startbar.
# Ohne „anwenden“ wird nur der Vergleich angezeigt (read-only).
on:
  workflow_dispatch:
    inputs:
      anwenden:
        description: 'Änderungen wirklich übertragen (sonst nur Vergleich anzeigen)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  konfiguration:
    name: Konfiguration vergleichen bzw. übertragen
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJEKT: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Code holen
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Projekt verknüpfen
        run: npx supabase link --project-ref "$PROJEKT"

      - name: Unterschiede anzeigen (nur lesen)
        run: npx supabase config diff

      - name: Übertragen
        if: inputs.anwenden
        run: npx supabase config push --yes
